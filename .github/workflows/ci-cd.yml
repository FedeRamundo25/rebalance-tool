name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install new frontend dependencies reproducibly
        run: npm ci --include=dev
        working-directory: Web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit and end-to-end tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Verify both pages were built
        run: test -f dist/index.html && test -f dist/app.html
      - name: Run new frontend unit tests
        run: npm run test:web
      - name: Build new React frontend
        run: npm run build
        working-directory: Web
      - name: Verify Cloudflare artifact matches this commit
        run: node scripts/verify-cloudflare-artifact.mjs
      - name: Validate Cloudflare Pages API proxy
        run: node --check "functions/[[path]].js"
        working-directory: Web
      - name: Install new API dependencies reproducibly
        run: npm ci
        working-directory: api
      - name: Run API validation tests
        run: npm test
        working-directory: api
      - name: Build new Node API
        run: npm run build
        working-directory: api
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  cloudflare-production-smoke:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Cloudflare production serves this commit and the API
        run: node scripts/smoke-cloudflare.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
